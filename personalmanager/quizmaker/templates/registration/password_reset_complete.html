{% extends "quizmaker/base.html" %}
{% load static %}
{% block title %}Password reset — Marginal{% endblock %}

{% block extra_css %}
  <link rel="stylesheet" href="{% static 'quizmaker/manage.css' %}">
  <link rel="stylesheet" href="{% static 'quizmaker/auth.css' %}">
{% endblock %}

{% block content %}
<div class="container">
  <div class="card form-card" style="text-align: center;">
    <div class="confirm-icon" style="background: var(--color-primary-soft); color: var(--color-primary-dark); margin-inline: auto;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M20 6L9 17l-5-5" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>

    <div class="form-header">
      <h1>Password updated</h1>
      <p class="text-soft" style="margin-top: 8px;">Your password has been changed. You can now log in with it.</p>
    </div>

    <a href="{% url 'quiz:login' %}" class="btn btn-block">Log in</a>
  </div>
</div>
{% endblock %}
